name: Narration Module CI

on:
  push:
    paths:
      - "test-GAME-2D/**"
      - ".github/workflows/narration-module-ci.yml"
  pull_request:
    paths:
      - "test-GAME-2D/**"
      - ".github/workflows/narration-module-ci.yml"

jobs:
  narration-module-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-GAME-2D
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: test-GAME-2D/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npm run narration-module:test:contracts

      - name: Run unit tests
        run: npm run narration-module:test:unit

      - name: Run integration tests
        run: npm run narration-module:test:integration
